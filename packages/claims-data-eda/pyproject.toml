[project]
name = "claims-data-eda"
version = "0.1.0"
description = "Full-corpus EDA of the CMS 2008-2010 DE-SynPUF (Medicare claims) and production of a pipeline-ready insurance_claim dataset for the llm-mailroom ecosystem."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "huggingface_hub>=0.30",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

# Monorepo: scripts/tests only, no build backend — resolve deps in the shared
# workspace venv without building/installing a distribution.
[tool.uv]
package = false
