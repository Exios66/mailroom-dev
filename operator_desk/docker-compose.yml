# Operator-desk sidecar around the existing The-Mailroom visualizer.
# Pixel console + Observatory stay vanilla (no Node/React UI).
# Langfuse stays the US-cloud document-display source — this file does not
# stand up a local Langfuse.

services:
  mailroom:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: mailroom-visualizer
    environment:
      - MAILROOM_EDITION=${MAILROOM_EDITION:-console}
      - MAILROOM_HOST=0.0.0.0
      - MAILROOM_PORT=8001
      - MAILROOM_BASE_DIR=/data
      - MAILROOM_OPERATOR_DB=/data/operator.db
      - MAILROOM_OPERATOR_JWT_SECRET=${MAILROOM_OPERATOR_JWT_SECRET:-dev-secret-change-me}
      - MAILROOM_OPERATOR_ADMIN_PASSWORD=${MAILROOM_OPERATOR_ADMIN_PASSWORD:-changeme}
      - MAILROOM_OPERATOR_INGEST_TOKEN=${MAILROOM_OPERATOR_INGEST_TOKEN:-}
      - MAILROOM_OBSERVER=${MAILROOM_OBSERVER:-1}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-https://us.cloud.langfuse.com}
      - MAILROOM_PIPELINE_URL=${MAILROOM_PIPELINE_URL:-}
      - MAILROOM_PIPELINE_TOKEN=${MAILROOM_PIPELINE_TOKEN:-}
    volumes:
      - mailroom-data:/data
    ports:
      - "8001:8001"
    command: python -m server.main

  mailroom-observer:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: mailroom-observer
    environment:
      - MAILROOM_BASE_DIR=/data
      - MAILROOM_OPERATOR_DB=/data/operator.db
      - MAILROOM_API_URL=http://mailroom:8001
      - MAILROOM_OPERATOR_INGEST_TOKEN=${MAILROOM_OPERATOR_INGEST_TOKEN:-}
      - MAILROOM_OBSERVER=0
    volumes:
      - mailroom-data:/data
    command: python -m operator_desk.observer
    depends_on:
      - mailroom

  mailroom-ui:
    profiles: ["ui"]
    build:
      context: ../ui
      dockerfile: Dockerfile
    container_name: mailroom-ui
    ports:
      - "5174:80"
    depends_on:
      - mailroom

  nginx:
    image: nginx:alpine
    container_name: mailroom-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - mailroom

volumes:
  mailroom-data:
