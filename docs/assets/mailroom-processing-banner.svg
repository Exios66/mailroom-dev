<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="t d"
     font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <title id="t">Mailroom Processing Pipeline</title>
  <desc id="d">Documents arrive by email, upload, or scan; are preprocessed; classified and extracted by an LLM; validated; then routed to systems of record. Low-confidence or failed items go to human review; corrected items re-enter preprocessing; unresolved items are archived. Cross-cutting: job queue, object storage, LLM gateway, observability, audit trail.</desc>

  <rect width="1200" height="600" fill="#FFFFFF"/>

  <defs>
    <marker id="arrP" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#475569"/>
    </marker>
    <marker id="arrX" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="50" y="46" font-size="24" font-weight="600" fill="#0F172A">Mailroom Processing Pipeline</text>
  <text x="50" y="72" font-size="13.5" fill="#64748B">End-to-end document flow — intake through routing, with human-in-the-loop exception handling</text>

  <!-- Legend -->
  <g font-size="11.5">
    <line x1="760" y1="42" x2="796" y2="42" stroke="#475569" stroke-width="1.75" marker-end="url(#arrP)"/>
    <text x="804" y="46" fill="#475569">primary flow</text>
    <line x1="898" y1="42" x2="934" y2="42" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrX)"/>
    <text x="942" y="46" fill="#64748B">exception path</text>
    <rect x="1050" y="33" width="14" height="14" rx="3" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
    <text x="1072" y="46" fill="#64748B">LLM stage</text>
  </g>

  <!-- Main lane -->
  <g>
    <rect x="50" y="124" width="150" height="88" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="66" y="148" font-size="9.5" font-weight="700" letter-spacing="1.2" fill="#94A3B8">STAGE 01</text>
    <text x="66" y="170" font-size="15" font-weight="600" fill="#0F172A">Intake</text>
    <text x="66" y="188" font-size="11" fill="#64748B">email · upload · scan</text>
    <text x="66" y="203" font-size="11" fill="#64748B">attachments, metadata</text>
  </g>
  <g>
    <rect x="240" y="124" width="150" height="88" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="256" y="148" font-size="9.5" font-weight="700" letter-spacing="1.2" fill="#94A3B8">STAGE 02</text>
    <text x="256" y="170" font-size="15" font-weight="600" fill="#0F172A">Preprocess</text>
    <text x="256" y="188" font-size="11" fill="#64748B">OCR · dedupe</text>
    <text x="256" y="203" font-size="11" fill="#64748B">text normalization</text>
  </g>
  <g>
    <rect x="430" y="124" width="150" height="88" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="446" y="148" font-size="9.5" font-weight="700" letter-spacing="1.2" fill="#6366F1">STAGE 03</text>
    <text x="446" y="170" font-size="15" font-weight="600" fill="#0F172A">Classify</text>
    <text x="446" y="188" font-size="11" fill="#64748B">doc type · intent</text>
    <text x="446" y="203" font-size="11" fill="#64748B">confidence score</text>
  </g>
  <g>
    <rect x="620" y="124" width="150" height="88" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="636" y="148" font-size="9.5" font-weight="700" letter-spacing="1.2" fill="#6366F1">STAGE 04</text>
    <text x="636" y="170" font-size="15" font-weight="600" fill="#0F172A">Extract</text>
    <text x="636" y="188" font-size="11" fill="#64748B">structured fields</text>
    <text x="636" y="203" font-size="11" fill="#64748B">key-value extraction</text>
  </g>
  <g>
    <rect x="810" y="124" width="150" height="88" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="826" y="148" font-size="9.5" font-weight="700" letter-spacing="1.2" fill="#94A3B8">STAGE 05</text>
    <text x="826" y="170" font-size="15" font-weight="600" fill="#0F172A">Validate</text>
    <text x="826" y="188" font-size="11" fill="#64748B">schema · policy</text>
    <text x="826" y="203" font-size="11" fill="#64748B">business rules</text>
  </g>
  <g>
    <rect x="1000" y="124" width="150" height="88" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="1016" y="148" font-size="9.5" font-weight="700" letter-spacing="1.2" fill="#94A3B8">STAGE 06</text>
    <text x="1016" y="170" font-size="15" font-weight="600" fill="#0F172A">Route</text>
    <text x="1016" y="188" font-size="11" fill="#64748B">systems of record</text>
    <text x="1016" y="203" font-size="11" fill="#64748B">deliver · notify</text>
  </g>

  <!-- Primary flow arrows -->
  <g stroke="#475569" stroke-width="1.75">
    <line x1="200" y1="168" x2="237" y2="168" marker-end="url(#arrP)"/>
    <line x1="390" y1="168" x2="427" y2="168" marker-end="url(#arrP)"/>
    <line x1="580" y1="168" x2="617" y2="168" marker-end="url(#arrP)"/>
    <line x1="770" y1="168" x2="807" y2="168" marker-end="url(#arrP)"/>
    <line x1="960" y1="168" x2="997" y2="168" marker-end="url(#arrP)"/>
  </g>

  <!-- Exception path -->
  <g stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 4" fill="none">
    <path d="M505 212 V321" marker-end="url(#arrX)"/>
    <path d="M885 212 V294 H700 V321" marker-end="url(#arrX)"/>
    <path d="M430 360 H363" marker-end="url(#arrX)"/>
  </g>
  <text x="497" y="254" text-anchor="end" font-size="10.5" fill="#64748B">low confidence</text>
  <text x="792" y="287" text-anchor="middle" font-size="10.5" fill="#64748B">failed checks</text>
  <text x="397" y="351" text-anchor="middle" font-size="10.5" fill="#64748B">reject</text>

  <!-- Corrected items re-enter the flow -->
  <path d="M470 324 V294 H370 V216" stroke="#475569" stroke-width="1.75" fill="none"
        stroke-linejoin="round" marker-end="url(#arrP)"/>
  <text x="420" y="287" text-anchor="middle" font-size="10.5" fill="#64748B">corrected · resubmit</text>

  <!-- Exception nodes -->
  <rect x="430" y="324" width="340" height="72" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="448" y="346" font-size="9.5" font-weight="700" letter-spacing="1.2" fill="#B45309">HUMAN-IN-THE-LOOP</text>
  <text x="448" y="367" font-size="15" font-weight="600" fill="#92400E">Human Review Queue</text>
  <text x="448" y="384" font-size="10.5" fill="#B45309">operator corrects and resubmits</text>

  <rect x="200" y="324" width="160" height="72" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="280" y="355" text-anchor="middle" font-size="14" font-weight="600" fill="#475569">Archive</text>
  <text x="280" y="374" text-anchor="middle" font-size="10.5" fill="#64748B">unresolved items</text>

  <!-- Cross-cutting services -->
  <rect x="50" y="464" width="1100" height="110" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="70" y="492" font-size="11" font-weight="700" letter-spacing="1.5" fill="#64748B">CROSS-CUTTING SERVICES</text>
  <g>
    <rect x="70" y="506" width="196" height="44" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="86" y="527" font-size="12.5" font-weight="600" fill="#334155">Job queue</text>
    <text x="86" y="542" font-size="10" fill="#64748B">async workers</text>
    <rect x="286" y="506" width="196" height="44" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="302" y="527" font-size="12.5" font-weight="600" fill="#334155">Object storage</text>
    <text x="302" y="542" font-size="10" fill="#64748B">documents + artifacts</text>
    <rect x="502" y="506" width="196" height="44" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="518" y="527" font-size="12.5" font-weight="600" fill="#334155">LLM gateway</text>
    <text x="518" y="542" font-size="10" fill="#64748B">routing · retries · cache</text>
    <rect x="718" y="506" width="196" height="44" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="734" y="527" font-size="12.5" font-weight="600" fill="#334155">Observability</text>
    <text x="734" y="542" font-size="10" fill="#64748B">logs · metrics · traces</text>
    <rect x="934" y="506" width="196" height="44" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="950" y="527" font-size="12.5" font-weight="600" fill="#334155">Audit trail</text>
    <text x="950" y="542" font-size="10" fill="#64748B">immutable event history</text>
  </g>
</svg>
