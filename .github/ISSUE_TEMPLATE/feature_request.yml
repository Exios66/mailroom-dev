name: Feature request
description: Propose an enhancement to the monorepo — workspace wiring, sync flow, governance tooling, or docs
title: "[Feature]: "
labels: ["type/feature"]
assignees: Exios66
body:
  - type: markdown
    attributes:
      value: |
        ## Feature request

        Hub-scope ideas usually fall into: **workspace wiring** (pyproject/uv),
        the **sub-package sync flow**, **governance tooling** (board, labels,
        templates, CI), **release tooling** (pins, upstream push, tagging), or
        **docs**. Say which. Package-level features belong in the package's
        own repo.

        Card-worthy work lands on `governance/TASKS.md` first (card before
        code) — this issue then mirrors it via the "Board card" template.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - workspace wiring (pyproject/uv, virtual members, dependency pins)
        - sub-package sync flow (sync_packages.py, subtree pull/push)
        - governance tooling (board tracker, labels, templates, CI)
        - release tooling (pin bumps, upstream publish, tagging)
        - docs (README/AGENTS/TASKS structure and currency)
        - other
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What problem or friction does this remove? Cite board cards, sync drift, or workflow failures as evidence
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: The concrete plan — new files/flags/labels, workflow steps, board law changes
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches and why they were rejected
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How we know this is done — verifiable, computationally readable criteria
      placeholder: |
        - [ ] python scripts/board_state.py check passes with the new invariant
        - [ ] suites for touched packages green
        - [ ] docs updated in the same commit (AGENTS.md / README / TASKS.md)
