name: release-governance

# HUB-024: keeps the hub's changelog <-> semver tag <-> pyproject chain honest.
# Runs the chain check on every version-tag push (the release act) and on
# demand. Blocking: a version tag must never exist without its CHANGELOG
# section, and the hub pyproject version must never be behind the newest tag.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-chain-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the check needs the full tag set
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Release-chain invariants
        run: python scripts/release_chain.py check
      - name: Release snapshot
        run: python scripts/release_chain.py status
