[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "the-mailroom"
version = "0.3.0"
description = "Pixel-art visualization console for the llm-mailroom multi-agent pipeline — Langfuse is the sole source of truth."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "langfuse>=4.0,<5",
    "pydantic>=2.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
# Pinned llm-mailroom (PyPI / dist name: mailroom) @ origin/main 2c0bcac
# (package 0.5.0). Pulls langgraph, Phoenix, and llm-dojo-scoring — the
# visualizer display path never imports those. Contract helpers live in
# mailroom_ui/producer.py (pipeline.review_resolve, schemas.manifest).
# Install with:  pip install -e ".[pipeline]"
pipeline = [
    "mailroom @ git+https://github.com/Exios66/llm-mailroom.git@2c0bcac",
    "structlog>=24.0",
    "pyyaml>=6.0",
]

[project.scripts]
mailroom-web = "server.main:run"
mailroom-hosted = "server.hosted:run"
mailroom-tui = "tui.mailroom_console:run"

[tool.setuptools.packages.find]
include = ["mailroom_ui*", "server*", "tui*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
