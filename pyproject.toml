[project]
name = "mailroom-hub"
version = "0.1.0"
description = "Monorepo for the LLM-Mailroom constellation: pipeline (llm-mailroom), eval loop (llm-entity-extraction), scoring engine (llm-dojo-scoring), and visualizer (The-Mailroom)"
readme = "README.md"
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
]
